<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1020" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Bible Arena: a Scripture knowledge game. Daily challenges, streaks, combos and 300+ verified questions, each with its verse." />
    <meta property="og:title" content="Bible Arena — Know the Word. Challenge the World." />
    <meta property="og:description" content="Daily challenges, streaks and combos. Learn a verse with every answer." />
    <meta property="og:image" content="/assets/images/icon.png" />
    <title>Bible Arena — Know the Word. Challenge the World.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0A1020; color: #F6F1E7; }
      body { overflow: hidden; margin: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
      #root { display: flex; height: 100%; flex: 1; }
      *:focus-visible { outline: 2px solid #F5B942; outline-offset: 2px; }
      .ba-boot { margin: auto; text-align: center; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .ba-boot b { display: block; font-size: 28px; letter-spacing: -0.5px; }
      .ba-boot span { display: block; margin-top: 8px; color: #8E9AB0; font-size: 14px; }
      .ba-ring { width: 40px; height: 40px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid rgba(245,185,66,0.2); border-top-color: #F5B942; animation: ba-spin 0.9s linear infinite; }
      @keyframes ba-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Bible Arena.</noscript>
    <div id="root"><div class="ba-boot"><div class="ba-ring"></div><b>Bible Arena</b><span>Know the Word. Challenge the World.</span></div></div>
  </body>
</html>
