<script>(function(){
var QS=[["The word “Selah” appears most often in which book?",["Psalms","Isaiah","Job","Proverbs"],0,"“Selah” appears over 70 times in the Psalms, and also in Habakkuk 3.","Psalm 3:2"],["In which city did Samson pull down the house of Dagon?",["Zorah","Timnath","Ashkelon","Gaza"],3,"The Philistines brought Samson down to Gaza, where he bowed himself with all his might.","Judges 16:21-30"],["Which river was Jesus baptised in?",["River Euphrates","River Nile","River Jordan","Sea of Galilee"],2,"John baptised Jesus in the River Jordan, after which the Spirit descended like a dove.","Matthew 3:13-17"],["“Be still, and know that I am ___.”",["near","God","with you","here"],1,"A call to rest in God’s power and sovereignty.","Psalm 46:10"],["The risen Jesus walked with two disciples toward which village?",["Bethphage","Bethany","Emmaus","Nain"],2,"Two of them went to a village called Emmaus, about threescore furlongs from Jerusalem.","Luke 24:13"],["Which book contains the longest chapter in the Bible?",["Numbers","Isaiah","Jeremiah","Psalms"],3,"Psalm 119 has 176 verses, arranged in sections for each letter of the Hebrew alphabet.","Psalm 119:105"],["According to 1 Corinthians 13, which is the greatest: faith, hope or charity?",["All are equal","Faith","Hope","Charity (love)"],3,"“And now abideth faith, hope, charity, these three; but the greatest of these is charity.”","1 Corinthians 13:13"],["The disciples of Jesus were first designated by the label 'Christians' at Syrian Antioch.",["Fact","Myth"],0,"Acts 11:26 states: 'And in Antioch the disciples were first called Christians.'","Acts 11:26"],["To which tribe of Israel did Moses and Aaron belong?",["Judah","Levi","Benjamin","Ephraim"],1,"Amram and Jochebed, Moses' parents, were both of the house of Levi.","Exodus 2:1"],["Who was the high priest when Jesus was brought before the council?",["Gamaliel","Caiaphas","Nicodemus","Annas"],1,"They led Jesus away to Caiaphas the high priest, where the scribes and elders were assembled.","Matthew 26:57"],["How many books are in the New Testament?",["21","66","39","27"],3,"The New Testament has 27 books, from Matthew to Revelation; the whole Bible has 66.","Matthew 1:1"],["The book of Revelation was written by the apostle Paul.",["Fact","Myth"],1,"It was given to 'his servant John', who was on the isle of Patmos.","Revelation 1:1,9"],["In which garden did Jesus endure intense sorrow and pray before his arrest?",["Garden of Eden","Garden of Gethsemane","Garden of Shushan","The King's Garden"],1,"Jesus prayed in Gethsemane on the Mount of Olives: 'Not my will, but yours be done.'","Matthew 26:36-46"],["In John’s Gospel, Jesus’ first miracle was turning water into wine.",["Fact","Myth"],0,"“This beginning of miracles did Jesus in Cana of Galilee.”","John 2:11"],["“Trust in the LORD with all thine heart; and lean not unto thine own ___.”",["understanding","riches","strength","friends"],0,"Proverbs calls us to rely on God rather than our own understanding.","Proverbs 3:5"],["After taking the stronghold of Zion, David made which city his capital?",["Jerusalem","Hebron","Shiloh","Bethlehem"],0,"David took the strong hold of Zion: the same is the city of David.","2 Samuel 5:7"],["To which country did Joseph and Mary flee with the young child Jesus?",["Moab","Egypt","Persia","Syria"],1,"Joseph took the young child and his mother by night and departed into Egypt.","Matthew 2:14"],["What is the first book of the Bible?",["Exodus","Genesis","Psalms","Matthew"],1,"Genesis means “beginning” and opens with creation.","Genesis 1:1"],["Elisha called down fire from heaven against the prophets of Baal on Mount Carmel.",["Fact","Myth"],1,"That was Elijah. The fire of the LORD fell and consumed the sacrifice after his prayer.","1 Kings 18:36-38"],["Roman soldiers cast lots for Jesus' seamless tunic at the foot of the cross.",["Fact","Myth"],0,"John 19:24 records the soldiers saying: 'Let us not tear it, but cast lots for it to see whose it shall be.'","John 19:24"],["What does the name “Emmanuel” mean?",["Prince of peace","Anointed one","God with us","Son of David"],2,"“They shall call his name Emmanuel, which being interpreted is, God with us.”","Matthew 1:23"],["Who was thrown into the den of lions for praying to God?",["Shadrach","Daniel","Nehemiah","Ezra"],1,"Daniel continued praying three times daily and was miraculously preserved in the lions' den.","Daniel 6:10-22"],["Abraham’s servant found a wife for Isaac at a well. Who was she?",["Leah","Keturah","Rebekah","Rachel"],2,"Isaac took Rebekah, and she became his wife; and he loved her.","Genesis 24:67"],["What was Jesus' first recorded sign in the Gospel of John?",["Healing a blind man","Walking on water","Turning water into wine","Feeding five thousand"],2,"At Cana, Jesus turned water into wine, revealing his glory to his disciples.","John 2:7-11"],["Which book comes just before Matthew?",["Revelation","Malachi","Psalms","Zechariah"],1,"Malachi closes the Old Testament.","Malachi 4:6"],["What bread did God send from heaven to feed Israel in the wilderness?",["Barley loaves","Showbread","Manna","Unleavened bread"],2,"Moses said, “This is the bread which the LORD hath given you to eat.”","Exodus 16:15"],["Which book is a collection of wise sayings, many from Solomon?",["Lamentations","Proverbs","Psalms","Job"],1,"“The proverbs of Solomon the son of David, king of Israel.”","Proverbs 1:1"],["The shortest recorded verse in the New Testament is 'Jesus wept.'",["Fact","Myth"],0,"John 11:35 contains merely two words in English: 'Jesus wept', expressing profound compassion at Lazarus' tomb.","John 11:35"],["Which is the shortest of the four Gospels?",["Luke","John","Matthew","Mark"],3,"Mark has 16 chapters and moves fast, often using the word “straightway.”","Mark 1:1"],["Which Gospel records the Sermon on the Mount with the Beatitudes?",["Matthew","John","Mark","Acts"],0,"Matthew 5–7 is the Sermon on the Mount.","Matthew 5:3"],["The Bible asserts that money in and of itself is the origin of all wickedness.",["Fact","Myth"],1,"1 Timothy 6:10 warns that 'the love of money is a root of all kinds of evils', not physical currency itself.","1 Timothy 6:10"],["When God first called Jonah to Nineveh, he went straight there.",["Fact","Myth"],1,"Jonah 'rose up to flee unto Tarshish from the presence of the LORD'.","Jonah 1:3"],["What did David use to defeat Goliath?",["A sling and a stone","A bow and arrow","A sword","A spear"],0,"David took a stone, slang it, and smote the Philistine in his forehead.","1 Samuel 17:49"],["Jonah boarded a ship heading where, to flee from the LORD?",["Tyre","Joppa","Nineveh","Tarshish"],3,"Jonah went down to Joppa and found a ship going to Tarshish.","Jonah 1:3"],["In which town was Jesus born?",["Jerusalem","Bethlehem","Capernaum","Nazareth"],1,"Jesus was born in Bethlehem of Judaea in the days of Herod the king.","Matthew 2:1"],["Which king dreamed of a great image with a head of gold?",["Belshazzar","Cyrus","Darius","Nebuchadnezzar"],3,"Daniel interpreted Nebuchadnezzar’s dream of the image of gold, silver, brass, iron and clay.","Daniel 2:31-32"]],VS=[["Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","Joshua 1:9 KJV"],["Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.","Psalm 46:10 KJV"],["This is the day which the LORD hath made; we will rejoice and be glad in it.","Psalm 118:24 KJV"],["Thy word is a lamp unto my feet, and a light unto my path.","Psalm 119:105 KJV"],["Trust in the LORD with all thine heart; and lean not unto thine own understanding.","Proverbs 3:5 KJV"],["In all thy ways acknowledge him, and he shall direct thy paths.","Proverbs 3:6 KJV"],["But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","Isaiah 40:31 KJV"],["For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","Jeremiah 29:11 KJV"],["It is of the LORD’S mercies that we are not consumed, because his compassions fail not.","Lamentations 3:22 KJV"],["They are new every morning: great is thy faithfulness.","Lamentations 3:23 KJV"],["Ye are the light of the world. A city that is set on an hill cannot be hid.","Matthew 5:14 KJV"],["But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","Matthew 6:33 KJV"],["Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Matthew 11:28 KJV"],["And the light shineth in darkness; and the darkness comprehended it not.","John 1:5 KJV"],["Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","John 8:12 KJV"],["Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","John 14:27 KJV"],["These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.","John 16:33 KJV"],["And we know that all things work together for good to them that love God, to them who are the called according to his purpose.","Romans 8:28 KJV"],["Rejoicing in hope; patient in tribulation; continuing instant in prayer;","Romans 12:12 KJV"],["Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.","Romans 15:13 KJV"],["Let all your things be done with charity.","1 Corinthians 16:14 KJV"],["(For we walk by faith, not by sight:)","2 Corinthians 5:7 KJV"],["And let us not be weary in well doing: for in due season we shall reap, if we faint not.","Galatians 6:9 KJV"],["For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:","Ephesians 2:8 KJV"],["I can do all things through Christ which strengtheneth me.","Philippians 4:13 KJV"],["And whatsoever ye do, do it heartily, as to the Lord, and not unto men;","Colossians 3:23 KJV"],["Now faith is the substance of things hoped for, the evidence of things not seen.","Hebrews 11:1 KJV"],["If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.","James 1:5 KJV"],["Casting all your care upon him; for he careth for you.","1 Peter 5:7 KJV"],["We love him, because he first loved us.","1 John 4:19 KJV"],["The LORD is my shepherd; I shall not want.","Psalm 23:1 KJV"],["The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","Psalm 27:1 KJV"],["O taste and see that the LORD is good: blessed is the man that trusteth in him.","Psalm 34:8 KJV"],["Delight thyself also in the LORD; and he shall give thee the desires of thine heart.","Psalm 37:4 KJV"],["What time I am afraid, I will trust in thee.","Psalm 56:3 KJV"],["My help cometh from the LORD, which made heaven and earth.","Psalm 121:2 KJV"],["He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","Micah 6:8 KJV"],["For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","2 Timothy 1:7 KJV"]];
var TIPS=["Daily Challenge: the same 10 questions for everyone, every day.","Sudden Death: one mistake ends it. How far can you go?","Who Am I? The fewer clues you need, the more points you score.","Bible or Myth: is it really in the Bible, or just a saying?","Challenge a friend with a code: same questions, head to head.","Every answer comes with its verse.","Fill in the Gap: tap the missing words of a verse.","Play online: join a live game with players right now.","Fun fact: Psalm 117 is the shortest chapter in the Bible, and Psalm 119 the longest.","Fun fact: the King James Version was first printed in 1611.","Fun fact: “Jesus wept.” (John 11:35) is the shortest verse in the KJV.","Fun fact: the Bible has 66 books, 39 in the Old Testament and 27 in the New.","Fun fact: Methuselah lived 969 years, the longest life recorded in the Bible."];
var el=document.getElementById("bl");if(!el)return;
var $=function(i){return document.getElementById(i)};
var t0=Date.now(),done=false,lastTap=0,ls={};
try{ls=JSON.parse(localStorage.getItem("ba-loader")||"{}")||{}}catch(e){}
var qi=(ls.q==null?Math.floor(Math.random()*QS.length):ls.q|0)%QS.length,ti=(ls.t==null?Math.floor(Math.random()*TIPS.length):ls.t|0)%TIPS.length,right=0,seen=0;
function keep(){try{localStorage.setItem("ba-loader",JSON.stringify({q:qi,t:ti}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ask(){
 var it=QS[qi],two=it[1].length==2,h='<div class="bl-lb">Quick question while you wait'+(seen?'<b>'+right+'/'+seen+' right</b>':'')+'</div><div class="bl-q">'+esc(it[0])+'</div><div class="bl-os'+(two?' bl-two':'')+'">';
 for(var i=0;i<it[1].length;i++)h+='<button class="bl-o" type="button" data-i="'+i+'">'+esc(it[1][i])+'</button>';
 $("blq").innerHTML=h+'</div><div class="bl-fb" id="blf"></div><button class="bl-nx" type="button" id="bln">Next question ›</button>';
 var bs=$("blq").querySelectorAll(".bl-o");
 for(var j=0;j<bs.length;j++)bs[j].onclick=function(){answer(+this.getAttribute("data-i"))};
 $("bln").onclick=function(){lastTap=Date.now();qi=(qi+1)%QS.length;keep();ask()};
}
function answer(k){
 var it=QS[qi],bs=$("blq").querySelectorAll(".bl-o"),ok=k===it[2];lastTap=Date.now();seen++;if(ok)right++;
 for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(i===it[2])bs[i].className+=" bl-ok";else if(i===k)bs[i].className+=" bl-no"}
 try{navigator.vibrate&&navigator.vibrate(ok?15:[30,40,30])}catch(e){}
 var f=$("blf");f.innerHTML=(ok?'<em class="bl-y">Correct!</em> ':'<em class="bl-n">Not quite.</em> It’s <em>'+esc(it[1][it[2]])+'</em>. ')+esc(it[3])+(it[4]?'<small>'+esc(it[4])+'</small>':'');f.className="bl-fb bl-on";$("bln").className="bl-nx bl-on";
 try{localStorage.setItem("ba-loader",JSON.stringify({q:(qi+1)%QS.length,t:ti}))}catch(e){}
}
var v=VS[Math.floor(Math.random()*VS.length)];$("blv").textContent="“"+v[0]+"”";$("blr").textContent="— "+v[1];

var tt=setInterval(tip,4500);
setTimeout(function(){if(!done)el.className="bl-show"},600);

window.BALoader={finish:finish};
